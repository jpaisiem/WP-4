<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
    body{
        background-color: #9e9e9e;
        font-family: Arial, sans-serif;
    }
/* Popup container - can be anything you want */
.popup {
  position: relative;
  display: inline-block;
  cursor: pointer;
  -webkit-user-select: none;
  -moz-user-select: none;
  -ms-user-select: none;
  user-select: none;
  text-align: left;
  background-color: lightgray;
}

/* The actual popup */
.popup .popuptext {
  visibility: hidden;
  width: fit-content;
  background-color: #555;
  color: #fff;
  text-align: left;
  border-radius: 6px;
  padding: 8px 0;
  position: absolute;
  z-index: 1;
  bottom: 125%;
  left: 50%;
  margin-top: 150px;
}

/* Popup arrow */
.popup .popuptext::after {
  content: "";
  position: absolute;
  top: 100%;
  left: 50%;
  margin-left: -5px;
  border-width: 5px;
  border-style: solid;
  border-color: #555 transparent transparent transparent;
}

/* Toggle this class - hide and show the popup */
.popup .show {
  visibility: visible;
  -webkit-animation: fadeIn 1s;
  animation: fadeIn 1s;
}

/* Add animation (fade in the popup) */
@-webkit-keyframes fadeIn {
  from {opacity: 0;} 
  to {opacity: 1;}
}

@keyframes fadeIn {
  from {opacity: 0;}
  to {opacity:1 ;}
}
</style>
</head>
<body>
<div class="popup" onclick="myFunction()" style=" text-align: left; display: flex; flex-direction: row;"><button style="margin-right: 35%; background-color: lightgray; border-color: transparent;">Find Chapter</button><h2>Growth As a Writer</h2>
  <br>
    <span class="popuptext" id="myPopup"> <table>
    <tr>
      <td><a href="#">Chapter 1</a></td>
      <td><a href="#">Chapter 2</a></td>
      <td><a href="#">Chapter 3</a></td>
    </tr>
    <tr>
      <td><a href="#">Chapter 4</a></td>
      <td><a href="#">Chapter 5</a></td>
      <td><a href="#">Chapter 6</a></td>
    </tr>
  </table></span>
</div>

<script>
// When the user clicks on div, open the popup
function myFunction() {
  var popup = document.getElementById("myPopup");
  popup.classList.toggle("show");
}
</script>

</body>
</html>
