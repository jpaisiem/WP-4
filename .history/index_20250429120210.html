<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
    body{
        background-color: #9e9e9e;
        font-family: Arial, sans-serif;
    }
.collapsible {
  background-color: #777;
  color: white;
  cursor: pointer;
  padding: 18px;
  width: 100%;
  border: none;
  text-align: left;
  outline: none;
  font-size: 15px;
}

.active, .collapsible:hover {
  background-color: #555;
}
.content {
  padding: 0 18px;
  display: none;
  overflow: hidden;
  background-color: #f1f1f1;
}
</style>
</head>
<body>
<div style=" text-align: left; display: flex; flex-direction: row;"><button type="button" class="collapsible" style="margin-right: 35%; background-color: lightgray; border-color: transparent;">Find Chapter</button><h2>Growth As a Writer</h2>
  <br>
  <br>
  <br>> <table>
    <tr>
      <td><a href="#">Chapter 1</a></td>
      <td><a href="#">Chapter 2</a></td>
      <td><a href="#">Chapter 3</a></td>
    </tr>
    <tr>
      <td><a href="#">Chapter 4</a></td>
      <td><a href="#">Chapter 5</a></td>
      <td><a href="#">Chapter 6</a></td>
    </tr>
  </table></span>
</div>

<script>
var coll = document.getElementsByClassName("collapsible");
var i;

for (i = 0; i < coll.length; i++) {
  coll[i].addEventListener("click", function() {
    this.classList.toggle("active");
    var content = this.nextElementSibling;
    if (content.style.display === "block") {
      content.style.display = "none";
    } else {
      content.style.display = "block";
    }
  });
}
</script>


</body>
</html>
